  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      overflow: hidden;
    }
    .container {
      text-align: center;
      padding: 32px 24px;
      max-width: 400px;
      width: 95%;
    }
    .logo {
      font-size: 1rem;
      font-weight: 700;
      color: #25D366;
      letter-spacing: 0.15em;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 400;
      color: #aaa;
      margin-bottom: 28px;
    }
    .slot {
      width: 200px;
      height: 200px;
      margin: 0 auto 24px;
    }
    .slot-ring {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 3px solid #25D366;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 20px rgba(37,211,102,0.3);
      animation: glow 1.5s ease-in-out infinite;
    }
    .slot-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px rgba(37,211,102,0.4); }
      50% { box-shadow: 0 0 50px rgba(37,211,102,0.8); }
    }
    .name-tag {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    .role-tag {
      font-size: 0.85rem;
      color: #25D366;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #25D366;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 16px 28px;
      border-radius: 14px;
      text-decoration: none;
      width: 100%;
      letter-spacing: 0.03em;
    }
    .btn:active { background: #1ebe5a; }
    .btn svg { width: 22px; height: 22px; fill: #fff; flex-shrink: 0; }
